<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body style="background-color: hsl(0, 0%, 85%);">
    <div class="login-container">
        <form class="login-form">
            <h2>Sign Up</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Sign Up</button>
            <p class="message">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aspernatur voluptate libero
                expedita laboriosam delectus commodi est quia neque! Nam officiis, quidem perferendis recusandae quam
                nesciunt. Autem quam laborum ab sint.</p>
            <a href="login.html" class="signUp-login">log in</a>
        </form>
    </div>

    <script src="assets/js/signUp.js"></script>
</body>

</html>
